# Timing belt / gear between motor shaft q1_act and arm joint q1_jnt (URDF mimic; no cable Bouc–Wen here).
# MuJoCo joint name is jnt1 (= URDF q1_jnt).

belt_joint_names: ["jnt1"]
# PMI_Server kGear[0]=32/60; URDF q1_jnt = gear_ratio * q1_act

gear_ratio: 0.5333333333333333
efficiency: 0.96

# Joint-space parasitic damping / friction [N·m·s/rad], [N·m]
belt_damping: 0.12
belt_coulomb: 0.1
belt_viscous: 0.04
v_eps: 0.06

# Optional small backlash / dead-zone [rad] + weak restoring in gap
deadzone_width: 0.0004
backlash_width: 0.0015
backlash_slope: 800.0
backlash_elastic_gain: 6.0

max_belt_effect_torque: 14.0

randomization:
  enabled: true
  # Around nominal mimic ratio 0.53333
  gear_ratio: [0.45, 0.62]
  efficiency: [0.92, 0.99]
  belt_damping: [0.06, 0.22]
  belt_coulomb: [0.05, 0.22]
  belt_viscous: [0.02, 0.08]
  backlash_width: [0.0005, 0.004]
  deadzone_width: [0.0002, 0.001]
  max_belt_effect_torque: [10.0, 18.0]
