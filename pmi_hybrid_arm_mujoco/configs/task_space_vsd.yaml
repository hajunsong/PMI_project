# Task-space VSD path tracking (Phase B 목표 컨트롤러 — 관절공간 VSD와 별개)
simulation:
  rng_seed: 0
  dt: 0.001
  duration: 2.0
  hold_initial_pose_sec: 0.0
  passive_viewer: true
  show_ik_path_overlay: true
  ik_path_overlay_samples: 128
  viewer_realtime_scale: 1.0
  save_plots: true
  validate_contracts: true

task_space_vsd:
  controlled_task:
    x: true
    y: true
    z: true
    roll: true
    pitch: true
    yaw: false

  desired_orientation:
    # IK Phase A 의 orientation.roll_pitch_reference 와 동일 의미
    roll_pitch_reference: initial_pose
    # roll_pitch_reference: fixed 일 때만 아래 값 사용
    roll: -1.57079632679
    pitch: 0.0
    yaw_mode: free

  gains:
    K_task:
      x: 50000.0
      y: 50000.0
      z: 50000.0
      roll: 5000.0
      pitch: 5000.0
    D_task:
      x: 8.0
      y: 8.0
      z: 8.0
      roll: 0.5
      pitch: 0.5

  limits:
    F_task:
      x: 999999.0
      y: 999999.0
      z: 999999.0
      roll: 999999.0
      pitch: 999999.0
    tau_jnt:
      - 999999.0
      - 999999.0
      - 999999.0
      - 999999.0
    tau_act:
      - 999999.0
      - 999999.0
      - 999999.0
      - 999999.0

  jacobian:
    mode: numerical
    epsilon: 1.0e-6
    flip_sign: 1

  torque_application_mode: joint_direct_debug

path:
  initial_actuator_rad:
    - 1.26513926
    - 8.49979867
    - 4.72038433
    - -1.50169410

  waypoints:
  - { t: 0.0, x:  0.25, y: -0.20, z: -0.10 }
  - { t: 0.5, x:  0.00, y: -0.35, z: -0.15 }
  - { t: 1.0, x: -0.25, y: -0.20, z: -0.10 }
  - { t: 1.5, x:  0.00, y: -0.35, z: -0.15 }
  - { t: 2.0, x:  0.25, y: -0.20, z: -0.10 }
  interpolation:
    type: quintic
    zero_velocity_at_waypoints: true
    zero_acceleration_at_waypoints: true

transmission:
  jnt1:
    actuator: q1_act
    ratio: 0.5333
    type: belt
  jnt2:
    actuator: q2_act
    ratio: 0.15
    type: cable_placeholder
  jnt3:
    actuator: q3_act
    ratio: 0.3
    type: cable_placeholder
  jnt4:
    actuator: q4_act
    ratio: 0.3
    type: cable_placeholder
